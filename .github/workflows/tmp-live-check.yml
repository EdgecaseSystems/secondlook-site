name: Temporary live site verification

on:
  push:
    branches:
      - fix/current-contract-and-ci-2026-09-13

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify deployed SecondLook site contract note
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 15 https://secondlook-site.edgecasesystems.workers.dev/ | grep -Fq 'X-SecondLook-Service-Use-Country: US'
          curl --fail --silent --show-error --location --max-time 15 https://secondlook-site.edgecasesystems.workers.dev/llms.txt | grep -Fq 'paid public service is currently limited to service use in the 50 U.S. states and District of Columbia'
      - name: Verify deployed Wait recovery guidance
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 15 https://wait-site.edgecasesystems.workers.dev/ | grep -Fq 'Idempotency-Key alone cannot recover capabilities'
          curl --fail --silent --show-error --location --max-time 15 https://wait-site.edgecasesystems.workers.dev/llms.txt | grep -Fq 'never blindly resend a payment-bearing request after an ambiguous result'
